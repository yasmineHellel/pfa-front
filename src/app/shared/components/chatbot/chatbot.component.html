<ng-container *ngIf="isMecanicien">
  <!-- Floating toggle button -->
  <button class="chat-fab" (click)="toggle()" [class.active]="isOpen" title="Assistant IA">
    <svg *ngIf="!isOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <svg *ngIf="isOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
    <span class="chat-badge" *ngIf="!isOpen && messages.length > 1">{{ messages.length - 1 }}</span>
  </button>

  <!-- Chat panel -->
  <div class="chat-panel" [class.open]="isOpen">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/>
          </svg>
        </div>
        <div>
          <div class="chat-title">Assistant GarageFlow</div>
          <div class="chat-subtitle">
            <span class="status-dot"></span> En ligne · IA Mécanique
          </div>
        </div>
      </div>
      <button class="chat-close" (click)="close()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" #messagesContainer>
      <div *ngFor="let msg of messages"
           class="chat-msg"
           [class.msg-user]="msg.role === 'user'"
           [class.msg-bot]="msg.role === 'bot'">
        <div class="msg-avatar" *ngIf="msg.role === 'bot'">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/>
          </svg>
        </div>
        <div class="msg-content">
          <div class="msg-bubble">{{ msg.text }}</div>
          <div class="msg-time">{{ msg.time }}</div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div class="chat-msg msg-bot" *ngIf="loading">
        <div class="msg-avatar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/>
          </svg>
        </div>
        <div class="msg-content">
          <div class="msg-bubble typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="chat-suggestions" *ngIf="messages.length === 1">
      <button class="suggestion-btn" (click)="input = 'Quelles sont mes réparations en cours ?'; send()">Réparations en cours</button>
      <button class="suggestion-btn" (click)="input = 'Combien de réparations ai-je terminées ?'; send()">Réparations terminées</button>
      <button class="suggestion-btn" (click)="input = 'Résume mon planning du jour'; send()">Planning du jour</button>
    </div>

    <!-- Input area -->
    <div class="chat-input-area">
      <textarea
        class="chat-textarea"
        [(ngModel)]="input"
        (keydown)="onKeydown($event)"
        [disabled]="loading"
        placeholder="Posez votre question…"
        rows="1"
        maxlength="500">
      </textarea>
      <button class="chat-send" (click)="send()" [disabled]="!input.trim() || loading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</ng-container>
