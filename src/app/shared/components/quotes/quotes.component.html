<div class="section-header" style="margin-bottom:16px;">
  <div class="section-title" style="font-size:16px;">Devis</div>
  <button class="btn btn-primary">+ Nouveau devis</button>
</div>

<div class="tabs">
  <button *ngFor="let tab of tabs; let i = index" class="tab" [class.active]="activeTab === i" (click)="setTab(i)">
    {{ tab }}
  </button>
</div>

<div *ngIf="loading" class="text-center py-4" style="color:var(--text-3)">Chargement…</div>
<div *ngIf="error" class="badge badge-red" style="margin-bottom:12px">{{ error }}</div>

<div class="table-card" *ngIf="!loading">
  <app-search-bar placeholder="🔍  Rechercher un devis…"></app-search-bar>
  <table>
    <thead>
      <tr>
        <th>N° Devis</th>
        <th>Client</th>
        <th>Date</th>
        <th>Description</th>
        <th>Total</th>
        <th>Statut</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let q of filtered">
        <td style="font-weight:700;color:var(--accent)">#{{ q.id }}</td>
        <td style="font-weight:500">{{ q.clientName }}</td>
        <td class="td-muted">{{ q.date }}</td>
        <td>{{ q.description }}</td>
        <td style="font-weight:600">{{ q.total | number }} TND</td>
        <td>
          <span class="badge" [ngClass]="statusBadge(q.status)">{{ statusLabel(q.status) }}</span>
        </td>
        <td>
          <div class="action-group">
            <button class="action-btn" title="Voir">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="action-btn" title="Éditer">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
