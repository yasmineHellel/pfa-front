<div class="section-header" style="margin-bottom:16px;">
  <div class="section-title" style="font-size:16px;">Véhicules</div>
  <button class="btn btn-primary">+ Nouveau véhicule</button>
</div>

<div *ngIf="loading" class="text-center py-4" style="color:var(--text-3)">Chargement…</div>
<div *ngIf="error" class="badge badge-red" style="margin-bottom:12px">{{ error }}</div>

<div class="table-card" *ngIf="!loading">
  <app-search-bar
    placeholder="🔍  Rechercher par immatriculation, marque, propriétaire…"
    [showFilter]="true"
    (searchChange)="onSearch($event)"
  ></app-search-bar>

  <table>
    <thead>
      <tr>
        <th>Immatriculation</th>
        <th>Marque / Modèle</th>
        <th>Moteur</th>
        <th>Année</th>
        <th>Propriétaire</th>
        <th>Kilométrage</th>
        <th>Réparations</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of filtered">
        <td style="font-weight:700;color:var(--accent)">{{ v.plate }}</td>
        <td>
          <div style="font-weight:500">{{ v.brand }} {{ v.model }}</div>
        </td>
        <td class="td-muted">{{ v.engine }}</td>
        <td>{{ v.year }}</td>
        <td>{{ v.clientName }}</td>
        <td class="td-muted">{{ v.mileage | number }} km</td>
        <td>{{ v.repairCount }}</td>
        <td>
          <div class="action-group">
            <button class="action-btn" title="Voir">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="action-btn" title="Éditer">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="action-btn danger" title="Supprimer">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4h6v2"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
