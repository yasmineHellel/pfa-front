<div class="section-header" style="margin-bottom:16px;">
  <div class="section-title" style="font-size:16px;">Gestion Clients</div>
  <button class="btn btn-primary">+ Nouveau client</button>
</div>

<div *ngIf="loading" class="text-center py-4" style="color:var(--text-3)">Chargement…</div>
<div *ngIf="error" class="badge badge-red" style="margin-bottom:12px">{{ error }}</div>

<div class="table-card" *ngIf="!loading">
  <app-search-bar
    placeholder="🔍  Rechercher par nom, téléphone, email…"
    [showFilter]="true"
    filterLabel="Tous les clients ▾"
    (searchChange)="onSearch($event)"
  ></app-search-bar>

  <table>
    <thead>
      <tr>
        <th>Client</th>
        <th>Téléphone</th>
        <th>Email</th>
        <th>Véhicules</th>
        <th>Réparations</th>
        <th>Total dépensé</th>
        <th>Dernière visite</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of filtered">
        <td>
          <div class="td-with-avatar">
            <div class="avatar" [ngClass]="'av-' + avatarColor(c)">{{ initials(c) }}</div>
            <div>
              <div style="font-weight:500">{{ c.firstName }} {{ c.lastName }}</div>
              <div class="td-muted">#{{ c.id }}</div>
            </div>
          </div>
        </td>
        <td>{{ c.phone }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.vehicleCount }}</td>
        <td>{{ c.repairCount }}</td>
        <td style="font-weight:600">{{ c.totalSpent | number }} TND</td>
        <td class="td-muted">{{ c.lastVisit }}</td>
        <td>
          <div class="action-group">
            <button class="action-btn" title="Voir">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="action-btn" title="Éditer">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="action-btn danger" title="Supprimer">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4h6v2"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
