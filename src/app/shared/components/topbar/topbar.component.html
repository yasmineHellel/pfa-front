<div class="topbar">
  <div class="topbar-title">{{ title }}</div>
  <div class="topbar-sep"></div>
  <div class="breadcrumb">{{ breadcrumb }}</div>

  <div class="topbar-right">
    <!-- Notifications -->
    <button class="notif-btn" title="Notifications">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <div class="notif-dot"></div>
    </button>

    <!-- User info -->
    <div class="user-info" *ngIf="user">
      <div class="user-chip">
        <div class="user-avatar-sm">{{ user.firstName[0] }}{{ user.lastName[0] }}</div>
        <span class="user-chip-name">{{ user.firstName }}</span>
        <span class="user-role-badge" [ngClass]="'role-' + user.role.toLowerCase()">{{ user.role }}</span>
      </div>
    </div>

    <!-- Logout -->
    <button class="btn btn-ghost" (click)="logout()" title="Déconnexion">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Déconnexion
    </button>
  </div>
</div>
